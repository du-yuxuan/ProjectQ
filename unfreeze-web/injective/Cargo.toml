[package]
name = "unfreeze-credential"
version = "0.1.0"
edition = "2021"
description = "Unfreeze soulbound credential contract for Injective"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std = { version = "2.1", features = ["staking"] }
cosmwasm-schema = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde-json-wasm = "1.0"
thiserror = "1.0"

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
codegen-units = 1
panic = "abort"
strip = true
